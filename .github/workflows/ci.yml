name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Type Check, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci --coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXTAUTH_SECRET: ci-placeholder-secret
          NEXTAUTH_URL: http://localhost:3000

  # Versioning lives here, not in the pre-push hook: git freezes the refs it will
  # send before running that hook, so a release commit created locally at push time
  # is never part of the push. Pushes made with GITHUB_TOKEN do not start new
  # workflow runs, so this cannot loop on its own release commit.
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [quality, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags: the bump is derived from the commits since the last tag
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for versionable commits
        id: check
        run: echo "needed=$(node scripts/check-versionable.js --since-tag --print)" >> "$GITHUB_OUTPUT"

      - name: Bump version, tag and push
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run release
          git push --follow-tags origin main

      - name: Report skipped release
        if: steps.check.outputs.needed != 'true'
        run: echo "No versionable commits (feat/fix/perf) since the last tag." >> "$GITHUB_STEP_SUMMARY"
